<text x="36" y="73" class="body" fill="#18232d">Postseal presentation repair. Sealed numbers only; no new experiment, pixels, GT, or predictions.</text>
<text x="36" y="102" class="body" fill="#18232d">Source/native IDs and actual published IDs are different fields. No selected OLD ID is copied backward.</text>
<text x="36" y="131" class="body" fill="#18232d">Eligible does not mean associated. No LR means not evaluated, never a zero score.</text>
<text x="36" y="160" class="body" fill="#18232d">Numbers are displayed to 6 decimals; exact values and source hashes remain in the original inventory.</text>
